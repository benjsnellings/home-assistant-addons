name: Multica Daemon (read-write)
version: "0.2.0"
slug: multica_rw
description: >-
  Multica agent daemon with a read-write Home Assistant config mount. Use this
  for agents that are allowed to edit configuration files and still query
  states/history.
url: https://github.com/benjsnellings/home-assistant-addons/tree/main/multica_rw
arch:
  - aarch64
  - amd64
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
  - type: ssl
    read_only: true
  - type: media
    read_only: false
options:
  multica_token: ""
  server_url: "https://api.multica.ai"
  app_url: "https://multica.ai"
  workspace_id: ""
  device_name: ""
  runtime_name: ""
  anthropic_api_key: ""
  max_concurrent_tasks: 2
  log_level: info
schema:
  multica_token: password?
  server_url: url
  app_url: url
  workspace_id: str?
  device_name: str?
  runtime_name: str?
  anthropic_api_key: password?
  max_concurrent_tasks: int(1,20)
  log_level: list(trace|debug|info|warning|error)
