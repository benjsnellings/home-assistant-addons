configuration:
  multica_token:
    name: Multica token
    description: Required personal access token (mul_…) from Multica Settings → API Tokens
  server_url:
    name: Server URL
    description: Multica API base URL
  app_url:
    name: App URL
    description: Multica web app URL
  workspace_id:
    name: Workspace ID
    description: Optional workspace to select after login
  device_name:
    name: Device name
    description: Multica daemon/computer name. Leave blank for the packaged default (HA Config read-write).
  runtime_name:
    name: Runtime name
    description: Multica runtime display name. Leave blank for the packaged default (Claude HA read-write).
  anthropic_api_key:
    name: Anthropic API key
    description: Optional API key for headless Claude Code authentication
  max_concurrent_tasks:
    name: Max concurrent tasks
    description: Maximum agent tasks this daemon runs in parallel
