name: Multica Daemon (read-only)
version: "0.2.1"
slug: multica_ro
description: >-
  Multica agent daemon with a read-only Home Assistant config, share, and media
  mounts. Use for safer agents that can inspect /config and query states/history
  but cannot modify those filesystems.
url: https://github.com/benjsnellings/home-assistant-addons/tree/main/multica_ro
arch:
  - aarch64
  - amd64
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
    path: /config
  - type: share
    read_only: true
  - type: ssl
    read_only: true
  - type: media
    read_only: true
options:
  multica_token: null
  server_url: "https://api.multica.ai"
  app_url: "https://multica.ai"
  workspace_id: ""
  device_name: ""
  runtime_name: ""
  anthropic_api_key: ""
  max_concurrent_tasks: 2
schema:
  multica_token: password
  server_url: url
  app_url: url
  workspace_id: str?
  device_name: str?
  runtime_name: str?
  anthropic_api_key: password?
  max_concurrent_tasks: int(1,20)
